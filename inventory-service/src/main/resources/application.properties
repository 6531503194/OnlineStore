spring.application.name=inventory-service
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3307/inventory_service
# spring.datasource.url=jdbc:mysql://inventory-mysql:3306/inventory_service
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=none
server.port=8082
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3307/inventory_service
# spring.flyway.url=jdbc:mysql://inventory-mysql:3306/inventory_service
spring.flyway.user=root
spring.flyway.password=mysql
